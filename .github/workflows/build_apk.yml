name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
  # Usamos macos-latest para compilar localmente dentro de la nube de forma ultra estable
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Get dependencies and build APK
        run: |
          cd freered_app
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: freered_app/build/app/outputs/flutter-apk/app-release.apk
